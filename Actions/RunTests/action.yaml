name: Run Tests
author: Microsoft Corporation
inputs:
  shell:
    description: Shell in which you want to run the action (powershell or pwsh)
    required: false
    default: powershell
  token:
    description: The GitHub token running the action
    required: false
    default: ${{ github.token }}
  project:
    description: Project folder
    required: false
    default: '.'
  projectName:
    description: Project display name
    required: false
    default: ''
  buildMode:
    description: Build mode used for this project
    required: false
    default: 'Default'
  installTestAppsJson:
    description: A path to a JSON-formatted list of test apps to run tests in
    required: false
    default: ''
  experimentalAlToolArchivePath:
    description: Experimental path to an exact AlTool ZIP archive, relative to this action or absolute
    required: false
    default: ''
  experimentalAlToolArchiveSha256:
    description: Exact SHA256 of the experimental AlTool ZIP archive
    required: false
    default: ''
  experimentalAlToolRenewSession:
    description: Whether to renew the AlTool server session for each ordered codeunit group
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: run
      shell: ${{ inputs.shell }}
      env:
        _token: ${{ inputs.token }}
        _project: ${{ inputs.project }}
        _projectName: ${{ inputs.projectName }}
        _buildMode: ${{ inputs.buildMode }}
        _installTestAppsJson: ${{ inputs.installTestAppsJson }}
        _experimentalAlToolArchivePath: ${{ inputs.experimentalAlToolArchivePath }}
        _experimentalAlToolArchiveSha256: ${{ inputs.experimentalAlToolArchiveSha256 }}
        _experimentalAlToolRenewSession: ${{ inputs.experimentalAlToolRenewSession }}
      run: |
        ${{ github.action_path }}/../Invoke-AlGoAction.ps1 -ActionName "RunTests" -Action {
          ${{ github.action_path }}/RunTests.ps1 -token $ENV:_token -project $ENV:_project -projectName $ENV:_projectName -buildMode $ENV:_buildMode -installTestAppsJson $ENV:_installTestAppsJson -experimentalAlToolArchivePath $ENV:_experimentalAlToolArchivePath -experimentalAlToolArchiveSha256 $ENV:_experimentalAlToolArchiveSha256 -experimentalAlToolRenewSession $ENV:_experimentalAlToolRenewSession
        }
branding:
  icon: terminal
  color: blue
